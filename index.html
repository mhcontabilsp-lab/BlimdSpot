<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>BlindSpot - Acesso Restrito</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/jpeg" href="logo.jpg">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <!-- SDK do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init({
              publicKey: "7Xl9Bozht218HmHLU",
            });
        })();
    </script>

    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Share Tech Mono', monospace; 
            background: #03050a; color: #e2e8f0; overflow: hidden; 
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        #map-wrapper {
            position: absolute; top: 0; right: 0; width: calc(100% - 400px); height: 100%;
            opacity: 0; transform: translateX(100px); transition: all 1s cubic-bezier(0.25, 1, 0.5, 1); z-index: 1;
        }
        #map { width: 100%; height: 100%; }

        #dynamic-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 400px; height: 560px; background: rgba(10, 15, 28, 0.85); 
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.4); 
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.15), inset 0 0 15px rgba(16, 185, 129, 0.05);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1); z-index: 10; display: flex; flex-direction: column;
        }

        body.is-logged #dynamic-panel {
            top: 0; left: 0; transform: translate(0, 0); height: 100vh; width: 400px; border-radius: 0;
            border-top: none; border-left: none; border-bottom: none; border-right: 1px solid rgba(16, 185, 129, 0.4);
            padding: 30px 24px; box-shadow: 10px 0 40px rgba(0,0,0,0.9);
            background: #080c16;
        }
        body.is-logged #map-wrapper { opacity: 1; transform: translateX(0); width: calc(100% - 400px); }

        #login-screen { opacity: 1; transition: opacity 0.4s ease; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; }
        #dashboard-screen { display: none; opacity: 0; transition: opacity 0.6s ease; flex-direction: column; height: 100%; }

        .brand-logo {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
            mix-blend-mode: screen; 
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.4));
        }

        .operator-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            padding-bottom: 16px;
        }
        .operator-profile {
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        .operator-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10B981;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: #10B981;
            margin-right: 12px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
            flex-shrink: 0;
        }
        .operator-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .operator-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .operator-email {
            font-size: 12px;
            color: #e2e8f0;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            max-width: 200px;
        }
        .logout-btn {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #F43F5E;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        .logout-btn:hover {
            background: #F43F5E;
            color: #fff;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
        }

        .input-field { 
            width: 100%; padding: 14px; border-radius: 6px; 
            border: 1px solid rgba(148, 163, 184, 0.3); 
            background: rgba(3, 5, 10, 0.6); 
            color: #10B981; 
            margin-bottom: 16px; font-size: 15px; 
            font-family: 'Share Tech Mono', monospace;
            outline: none; transition: all 0.3s ease; 
        }
        .input-field:focus { 
            border-color: #10B981; 
            background: rgba(16, 185, 129, 0.03);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.25); 
        }

        .action-btn { 
            background: linear-gradient(135deg, #10B981 0%, #059669 100%); 
            color: #03050a; border: none; padding: 16px; width: 100%; 
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; 
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease; margin-top: 10px; 
        }
        .action-btn:hover { 
            background: linear-gradient(135deg, #34d399 0%, #10B981 100%);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            transform: translateY(-1px);
        }
        
        #login-error { color: #F43F5E; font-size: 13px; margin-top: 15px; font-weight: bold; display: none; text-align: center; width: 100%; }
        
        .data-row { display: flex; justify-content: space-between; margin-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; align-items: center;}
        .label { color: #64748b; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .value { font-weight: bold; font-size: 14px; text-align: right; max-width: 65%; word-wrap: break-word; color: #e2e8f0; }
        
        .danger-btn { 
            background: #F43F5E; color: white; border: none; padding: 16px; 
            border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; 
            margin-top: auto; font-size: 14px; 
            font-family: 'Rajdhani', sans-serif;
            transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 2px;
        }
        .danger-btn:hover:not(:disabled) { 
            background: #e11d48; 
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.5); 
        }
        .danger-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="dynamic-panel">
        <div id="login-screen">
            <img src="logo.jpg" alt="BlindSpot Logo" class="brand-logo">
            
            <input type="email" id="emailInput" class="input-field" placeholder=">> ID_DE_ACESSO (E-MAIL)">
            <input type="password" id="passwordInput" class="input-field" placeholder=">> CHAVE_MESTRE (SENHA)">
            <button class="action-btn" id="loginBtn" type="button">INICIALIZAR CONEXÃO</button>
            <div id="login-error">[!] ACESSO NEGADO: CREDENCIAIS INVÁLIDAS.</div>
        </div>

        <div id="dashboard-screen">
            <div class="operator-header">
                <div class="operator-profile">
                    <div class="operator-avatar" id="operatorInitial">?</div>
                    <div class="operator-info">
                        <span class="operator-label">Operador Ativo</span>
                        <span class="operator-email" id="targetEmail">--</span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn" type="button" title="Encerrar Sessão">SAIR</button>
            </div>
            
            <div class="data-row">
                <span class="label">Hardware:</span>
                <span class="value" id="deviceModel">Sincronizando...</span>
            </div>
            <div class="data-row">
                <span class="label">Latitude:</span>
                <span class="value" id="lat">--</span>
            </div>
            <div class="data-row">
                <span class="label">Longitude:</span>
                <span class="value" id="lng">--</span>
            </div>
            <div class="data-row">
                <span class="label">Último Batimento:</span>
                <span class="value" id="time">--</span>
            </div>

            <button class="danger-btn" id="lockBtn" type="button" disabled>ACIONAR KILL SWITCH</button>
        </div>
    </div>

    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwkUn65OcZUxK1X4rt80pNXPymT1ChWl0",
            authDomain: "blindspot-deb9b.firebaseapp.com",
            projectId: "blindspot-deb9b",
            storageBucket: "blindspot-deb9b.firebasestorage.app",
            messagingSenderId: "898527876162",
            appId: "1:898527876162:web:57759633dad7b6fe1049db"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let map = null;
        let marker = null; 
        let unsubscribe = null; 
        let currentEmail = "";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentEmail = user.email;
                document.getElementById("targetEmail").innerText = user.email;
                document.getElementById("operatorInitial").innerText = user.email.charAt(0).toUpperCase();

                document.getElementById("login-screen").style.opacity = "0";
                document.getElementById("login-screen").style.display = "none";
                
                document.body.classList.add("is-logged");
                document.getElementById("dashboard-screen").style.display = "flex";
                document.getElementById("dashboard-screen").style.opacity = "1";
                
                if (!map) {
                    iniciarMapaERastreamento();
                }
            }
        });

        async function fazerLogin() {
            console.log(">> Botão de login clicado com sucesso!");
            
            const email = document.getElementById("emailInput").value.trim();
            const password = document.getElementById("passwordInput").value;
            const errorMsg = document.getElementById("login-error");
            const btn = document.getElementById("loginBtn");

            console.log(">> A processar credenciais para:", email);

            if (!email || !password) {
                errorMsg.innerText = "[!] Preencha todos os campos de identificação.";
                errorMsg.style.display = "block";
                return;
            }

            try {
                errorMsg.style.display = "none";
                btn.innerText = "AUTENTICANDO...";
                
                console.log(">> A contactar o Firebase Auth...");
                await signInWithEmailAndPassword(auth, email, password);
                console.log(">> Login no Firebase bem-sucedido!");
                
                currentEmail = email;
                document.getElementById("targetEmail").innerText = email;
                document.getElementById("operatorInitial").innerText = email.charAt(0).toUpperCase();

                document.getElementById("login-screen").style.opacity = "0";
                
                setTimeout(() => {
                    document.getElementById("login-screen").style.display = "none";
                    document.body.classList.add("is-logged");
                    document.getElementById("dashboard-screen").style.display = "flex";
                    
                    setTimeout(() => {
                        document.getElementById("dashboard-screen").style.opacity = "1";
                        if (!map) {
                            iniciarMapaERastreamento();
                        }
                    }, 500); 
                }, 400); 

            } catch (error) {
                console.error("ERRO CRÍTICO NO LOGIN:", error);
                btn.innerText = "INICIALIZAR CONEXÃO";
                errorMsg.innerText = "[!] ERRO: " + error.code;
                errorMsg.style.display = "block";
            }
        }

        async function fazerLogout() {
            if (confirm("Deseja realmente encerrar a sessão do centro de comando?")) {
                try {
                    if (unsubscribe) unsubscribe();
                    await signOut(auth);
                    window.location.reload();
                } catch (error) {
                    console.error("Erro ao fazer logout:", error);
                }
            }
        }

        function iniciarMapaERastreamento() {
            if (map) return;

            map = L.map('map').setView([-14.235, -51.925], 4);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 16
            }).addTo(map);

            setTimeout(() => { map.invalidateSize(); }, 500);

            const docRef = doc(db, "devices", currentEmail);
            
            unsubscribe = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    document.getElementById("deviceModel").innerText = data.deviceModel ? data.deviceModel.toUpperCase() : "AGUARDANDO...";
                    document.getElementById("lat").innerText = data.latitude;
                    document.getElementById("lng").innerText = data.longitude;
                    
                    const date = new Date(data.lastUpdate);
                    document.getElementById("time").innerText = date.toLocaleTimeString();

                    if(data.command === "LOCKDOWN") {
                        document.getElementById("time").innerText += " ⚠️ [BLOQUEADO]";
                    }

                    document.getElementById("lockBtn").disabled = false;

                    const latLng = [data.latitude, data.longitude];
                    if (!marker) { marker = L.marker(latLng).addTo(map); } 
                    else { marker.setLatLng(latLng); }
                    map.setView(latLng, 16); 
                } else {
                    document.getElementById("deviceModel").innerText = "ALVO OFFLINE";
                    document.getElementById("lockBtn").disabled = true;
                }
            });
        }

        async function bloquearApp() {
            if(!currentEmail) return;
            
            if(confirm("ALERTA TÁTICO: Acionar protocolo Kill Switch remoto? O PIN de resgate será enviado para " + currentEmail)) {
                
                const btn = document.getElementById("lockBtn");
                btn.innerText = "TRANSMITINDO...";
                btn.disabled = true;

                try {
                    const geradorPin = Math.floor(100000 + Math.random() * 900000).toString();
                    
                    const docRef = doc(db, "devices", currentEmail);
                    await updateDoc(docRef, { command: "LOCKDOWN", recoveryPin: geradorPin });
                    
                    const templateParams = {
                        to_email: currentEmail,
                        device: document.getElementById("deviceModel").innerText,
                        pin_code: geradorPin
                    };
                    
                    // Adicionado window.emailjs para garantir que encontra a biblioteca globalmente
                    await window.emailjs.send("service_iyt7gof", "template_0k1ndiq", templateParams);

                    alert("GATILHO EXECUTADO!\n\nDispositivo bloqueado na nuvem e PIN de resgate enviado com sucesso para:\n" + currentEmail);
                    
                } catch (error) {
                    console.error("Erro detalhado na operação:", error);
                    
                    // Captura o motivo exato da falha do EmailJS
                    const detalheErro = error.text || error.message || JSON.stringify(error);
                    alert("Comando enviado ao Firebase, mas houve falha na API do EmailJS.\n\nMotivo do erro: " + detalheErro);
                    
                } finally {
                    btn.innerText = "ACIONAR KILL SWITCH";
                    btn.disabled = false;
                }
            }
        }

        // Associa os eventos de clique de forma segura assim que os elementos carregam
        document.addEventListener("DOMContentLoaded", () => {
            const loginBtn = document.getElementById("loginBtn");
            if (loginBtn) loginBtn.addEventListener("click", fazerLogin);

            const logoutBtn = document.getElementById("logoutBtn");
            if (logoutBtn) logoutBtn.addEventListener("click", fazerLogout);

            const lockBtn = document.getElementById("lockBtn");
            if (lockBtn) lockBtn.addEventListener("click", bloquearApp);
        });
    </script>
</body>
</html>
